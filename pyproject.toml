[project]
name = "pkc-arckit"
version = "0.2.0"
description = "Deterministic Phase 1 importer from native ArcKit Markdown into Project Knowledge Capture."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Spillwave Solutions"}]
dependencies = []

[project.scripts]
pkc-arckit = "pkc_arckit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pkc_arckit*"]
